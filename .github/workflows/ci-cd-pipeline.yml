name: AI Recruitment Platform CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:

  frontend-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  backend-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Verify Backend
        run: |
          cd backend
          python -c "print('Backend Build Successful')"

  docker-build:

    runs-on: ubuntu-latest

    needs:
      - frontend-build
      - backend-build

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t frontend ./frontend

      - name: Build Backend Docker Image
        run: docker build -t backend ./backend